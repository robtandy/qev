name: Deploy qev to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned package without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Unit and syntax checks
        run: npm test && npm run check
      - name: Cache pinned Emscripten toolchain
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/tools/emsdk
          key: qev-emsdk-${{ runner.os }}-3.1.74-${{ hashFiles('scripts/setup-toolchain.sh') }}
      - name: Install pinned toolchain
        run: npm run setup:engine
      - name: Build normal engine (no evaluation telemetry)
        run: npm run build:engine
      - name: Install and verify LibreQuake demo
        run: npm run setup:demo
      - name: Assemble static artifact and corresponding source
        run: npm run build:pages
      - name: Test static /qev/ deployment in muted Chrome
        env:
          CHROME_PATH: google-chrome
        run: npm run test:pages
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload only the generated site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
